<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HELIX Sign In</title>
<style>
  :root { --ground:#EDEFEA; --surface:#FCFCFB; --ink:#151A16; --ink2:#4E5850; --line:#D8DCD4; --accent:#0B7C5C; --bad:#B42318; }
  @media (prefers-color-scheme: dark) { :root { --ground:#0F1311; --surface:#161B18; --ink:#E8ECE7; --ink2:#9AA59D; --line:#2A332D; --accent:#3FB68B; --bad:#FF7A6B; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--ground); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
  .mark { font-weight:700; letter-spacing:.14em; font-size:13px; color:var(--accent); }
  h1 { font-size:22px; margin:6px 0 4px; }
  p.sub { color:var(--ink2); margin:0 0 20px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--ink2); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:18px; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:600 15px/1 inherit; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .msg { min-height:20px; margin-top:12px; font-size:13px; color:var(--bad); }
  .foot { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--ink2); }
  .hidden { display:none; }
</style>
</head>
<body>
<main class="card">
  <div class="mark">HELIX</div>
  <h1>Sign in to the console</h1>
  <p class="sub" id="status">Checking for a saved session…</p>
  <form id="form" class="hidden" autocomplete="on">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <div class="foot">Protected by Nova Shield. Your session is locked to this browser, so a copied cookie won't work anywhere else.</div>
</main>
<script src="/_shield/sdk.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
