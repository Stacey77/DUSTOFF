# Parts library. Every rating comes from the manufacturer's datasheet or product page.
# Values are typical unless marked min/max. "source" is where each number was read.

regulators:
  TPS562201:
    manufacturer: Texas Instruments
    kind: buck_regulator
    description: 4.5-17V input, 2A synchronous buck
    vin_min: 4.5
    vin_max: 17.0
    iout_rated: 2.0          # A, continuous output rating
    current_limit_min: 2.4   # A, Iocl min (DC current)
    current_limit_typ: 3.2
    fsw: 580e3               # Hz, typ
    rds_high: 0.140          # ohm, high-side, typ 25C
    rds_low: 0.084           # ohm, low-side, typ 25C
    theta_ja: 90.8           # C/W, DDC package, JEDEC board (reference only)
    psi_jb: 16.3             # C/W, junction-to-board characterization
    tj_max: 150
    footprint: SOT-23-6
    source: https://www.ti.com/lit/gpn/TPS562201
  TPS563201:
    manufacturer: Texas Instruments
    kind: buck_regulator
    description: 4.5-17V input, 3A synchronous buck
    vin_min: 4.5
    vin_max: 17.0
    iout_rated: 3.0
    current_limit_min: 3.3
    current_limit_typ: 4.2
    fsw: 580e3
    rds_high: 0.095
    rds_low: 0.057
    theta_ja: 92.6
    psi_jb: 15.5
    tj_max: 150
    footprint: SOT-23-6
    source: https://www.ti.com/lit/gpn/TPS563201
  TPS564201:
    manufacturer: Texas Instruments
    kind: buck_regulator
    description: 4.5-17V input, 4A synchronous buck
    vin_min: 4.5
    vin_max: 17.0
    iout_rated: 4.0
    current_limit_min: 4.2
    current_limit_typ: 6.0
    fsw: 560e3               # Hz, typ (datasheet test condition VO = 1.05 V)
    rds_high: 0.050
    rds_low: 0.022
    theta_ja: 86.3
    psi_jb: 13.3
    tj_max: 125              # recommended operating maximum
    footprint: SOT-23-6
    source: https://www.ti.com/lit/gpn/TPS564201

inductors:
  LPS4018-472:
    manufacturer: Coilcraft
    inductance: 4.7e-6
    dcr_max: 0.130           # ohm
    isat: 1.8                # A, at 10% inductance drop
    irms_20c: 1.3            # A, 20C rise (reference)
    irms_40c: 1.8
    footprint: 4x4mm
    source: https://www.coilcraft.com/en-us/products/power/shielded-inductors/ferrite-drum/lps/lps4018/
  XAL4030-472:
    manufacturer: Coilcraft
    inductance: 4.7e-6
    dcr_max: 0.0441
    isat: 4.6                # A, at 30% inductance drop (only level published)
    irms_20c: 3.9
    irms_40c: 5.1
    footprint: 4x4mm
    source: https://www.coilcraft.com/en-us/files/datasheet/XAL40xx

capacitors:
